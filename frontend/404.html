<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Resource Not Found | Green Finance</title>
    <link rel="stylesheet" href="/shared/styles.css">
    <style>
        :root {
            --bg-dark: #0b0f17;
            --emerald: #10b981;
            --slate: #94a3b8;
        }
        body {
            background-color: var(--bg-dark);
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 1rem;
        }
        .card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 2.5rem;
            max-width: 480px;
            width: 100%;
        }
        .code {
            font-size: 5rem;
            font-weight: 800;
            color: var(--emerald);
            line-height: 1;
            margin-bottom: 1rem;
        }
        h2 { margin-bottom: 0.75rem; font-size: 1.5rem; }
        p { color: var(--slate); font-size: 0.9rem; margin-bottom: 1.5rem; }
        .btn-home {
            background: var(--emerald);
            color: #064e3b;
            text-decoration: none;
            padding: 0.6rem 1.25rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            display: inline-block;
            transition: all 0.2s;
        }
        .btn-home:hover { background: #059669; color: #fff; }
    </style>
</head>
<body>
    <div class="card">
        <div class="code">404</div>
        <h2>Resource Not Found</h2>
        <p>The requested ledger asset, dashboard, or endpoint cannot be located or has been moved under strict perimeter security policies.</p>
        <a href="/" class="btn-home">Return to Main Portal</a>
    </div>
</body>
</html>
