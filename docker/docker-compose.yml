# =====================================================================
# GREEN-FINANCE — DOCKER COMPOSE ORCHESTRATION (LINUX BARE-METAL & OBSERVABILITY)
# Services:
#   1. green-finance-app (Unified FastAPI Core Banking & Telemetry Platform)
#   2. kepler (CNCF eBPF Energy Telemetry reading physical Intel/AMD RAPL)
#   3. prometheus (Time-series TSDB scraping /metrics and Kepler on :9103)
#   4. grafana (Pre-provisioned dashboards on :3000)
# =====================================================================

services:

  # 1. Unified Green-Finance Core Banking Platform
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: green-finance-app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///test.db
      - USE_SQLITE=true
      - PROMETHEUS_URL=http://prometheus:9090
      - APP_NAME=green-finance
      - ENVIRONMENT=production
    networks:
      - green-finance-net
    restart: unless-stopped

  # 2. Energy Telemetry Layer (CNCF Kepler eBPF)
  kepler:
    image: quay.io/sustainable_computing_io/kepler:release-0.7.11
    container_name: kepler
    privileged: true
    pid: host
    ports:
      - "9103:9103"
    volumes:
      - /proc:/proc
      - /sys:/sys
      - /usr/src:/usr/src:ro
      - /lib/modules:/lib/modules:ro
    command:
      - "-address=0.0.0.0:9103"
    networks:
      - green-finance-net
    restart: unless-stopped

  # 3. Metrics Aggregation Layer (Prometheus)
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - green-finance-net
    depends_on:
      - kepler
    restart: unless-stopped

  # 4. Visualization Layer (Grafana)
  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - green-finance-net
    depends_on:
      - prometheus
    restart: unless-stopped

networks:
  green-finance-net:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data: