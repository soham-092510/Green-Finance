global:
  # Scrape every 10 seconds (SRS requirement: <= 15s)
  scrape_interval: 10s

# SCRAPE TARGETS
scrape_configs:
  # -------------------------------------------------------
  # Green Finance Core API Metrics
  - job_name: "green-finance"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "host.docker.internal:8000"
          - "payment-service:8000"
          - "auth-service:8000"

  # -------------------------------------------------------
  # Kepler Energy Telemetry Metrics
  - job_name: "kepler"
    static_configs:
      - targets:
          - "kepler:9103"
          - "host.docker.internal:9103"