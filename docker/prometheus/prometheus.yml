global:
  scrape_interval: 10s

scrape_configs:
  # -------------------------------------------------------
  # Green Finance Core API Metrics
  - job_name: "green-finance"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "app:8000"
          - "host.docker.internal:8000"
          - "127.0.0.1:8000"

  # -------------------------------------------------------
  # Kepler Energy Telemetry Metrics
  - job_name: "kepler"
    static_configs:
      - targets:
          - "kepler:9103"
          - "host.docker.internal:9103"
          - "127.0.0.1:9103"